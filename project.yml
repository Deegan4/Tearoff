name: Tearoff
options:
  bundleIdPrefix: com.tearoff
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true

packages:
  VaultCore:
    path: Packages/VaultCore

targets:
  Tearoff:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: VaultCore
      - target: TearoffWidgets
    entitlements:
      path: App/Tearoff.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tearoff.vault
        com.apple.developer.icloud-services:
          - CloudKit
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.tearoff.app
        aps-environment: production
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Tearoff
        NSCameraUsageDescription: Tearoff uses the camera to scan paper receipts so it can log purchases and track return windows.
        NSRemindersFullAccessUsageDescription: Tearoff adds a reminder on your return deadline so you don't miss the window.
        NSLocationWhenInUseUsageDescription: Tearoff checks your location only while the app is open, to tag a store when you save a purchase and to nudge you if you're back nearby with an open return window. Your location is never stored or sent anywhere.
        NSSupportsLiveActivities: true
        ITSAppUsesNonExemptEncryption: false
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "11"
        UIBackgroundModes:
          - remote-notification
        UILaunchScreen: {}
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tearoff.app
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: A6H72TGWNL
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    scheme:
      testTargets:
        - TearoffTests
      # Local StoreKit testing: the scheme runs against this config so the
      # paywall works in the simulator without App Store Connect.
      storeKitConfiguration: Tearoff.storekit

  TearoffWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: TearoffWidgets
      - path: Shared
    dependencies:
      - package: VaultCore
    entitlements:
      path: TearoffWidgets/TearoffWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.tearoff.vault
    info:
      path: TearoffWidgets/Info.plist
      properties:
        CFBundleDisplayName: Tearoff
        # Must match the app target exactly, or the widget extension is
        # rejected at upload as a version mismatch.
        CFBundleShortVersionString: "1.0.1"
        CFBundleVersion: "11"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.tearoff.app.widgets
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        DEVELOPMENT_TEAM: A6H72TGWNL
        CODE_SIGN_STYLE: Automatic
        SKIP_INSTALL: YES

  TearoffTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - path: AppTests
    dependencies:
      - target: Tearoff
      - package: VaultCore
    settings:
      base:
        SWIFT_VERSION: "6.0"
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.tearoff.app.tests
