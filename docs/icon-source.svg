<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2E8B8B"/>
      <stop offset="1" stop-color="#1C6E6E"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F1F5F4"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="26" flood-color="#0C3B3B" flood-opacity="0.30"/>
    </filter>
  </defs>

  <!-- Background (full-bleed; iOS applies its own rounded mask) -->
  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- Receipt paper: top straight, bottom torn (zigzag). One path so the
       torn edge is part of the silhouette, not an overlay. -->
  <g filter="url(#shadow)">
    <path fill="url(#paper)" d="
      M298 232
      h428
      a24 24 0 0 1 24 24
      v470
      l-33 26 -33 -26 -33 26 -33 -26 -33 26 -33 -26 -33 26 -33 -26
      -33 26 -33 -26 -33 26 -33 -26 -33 26 -33 -26
      V256
      a24 24 0 0 1 24 -24 z"/>
  </g>

  <!-- Printed lines -->
  <g fill="#CBD6D5">
    <rect x="360" y="316" width="304" height="30" rx="15"/>
    <rect x="360" y="388" width="230" height="22" rx="11"/>
    <rect x="360" y="436" width="270" height="22" rx="11"/>
    <rect x="360" y="484" width="200" height="22" rx="11"/>
  </g>

  <!-- Trust seal: a coin with a checkmark, overlapping the receipt -->
  <g filter="url(#shadow)">
    <circle cx="646" cy="612" r="118" fill="#F4B740"/>
    <circle cx="646" cy="612" r="118" fill="none" stroke="#D99A1E" stroke-width="10"/>
    <path d="M590 614 l38 40 74 -92" fill="none" stroke="#FFFFFF"
          stroke-width="34" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
